<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#15171c;color:#e8eaed;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  .wrap{box-sizing:border-box;padding:70px 90px}
  .title{font-size:34px;font-weight:bold;margin:0 0 42px;color:#c7cbd1}
  .row{white-space:nowrap}
  .tile{display:inline-block;vertical-align:top;width:272px;height:196px;margin-right:26px;background:#23262d;border-radius:18px;text-align:center;box-sizing:border-box;padding-top:30px}
  .tile.focus{background:#2d3139;outline:4px solid #76b900}
  .num{font-size:60px;color:#aeb3ba;line-height:1}
  .tile img{height:78px;margin-top:4px}
  .lbl{font-size:24px;font-weight:bold;margin-top:20px}
</style></head>
<body>
<div class="wrap">
  <div class="title">Select Input</div>
  <div class="row" id="row">
    <div class="tile" data-app="com.webos.app.hdmi1"><div class="num">1</div><div class="lbl">HDMI 1</div></div>
    <div class="tile" data-app="com.webos.app.hdmi2"><div class="num">2</div><div class="lbl">HDMI 2</div></div>
    <div class="tile" data-app="com.webos.app.hdmi3"><img src="shield.png"><div class="lbl">NVIDIA Shield</div></div>
    <div class="tile" data-app="com.webos.app.hdmi4"><div class="num">4</div><div class="lbl">HDMI 4</div></div>
    <div class="tile" data-app="com.webos.app.livetv"><div class="num">&#9654;</div><div class="lbl">Live TV</div></div>
  </div>
</div>
<script>
try{
  var tiles=document.getElementsByClassName("tile"),idx=0;
  function setFocus(n){tiles[idx].className="tile";idx=(n+tiles.length)%tiles.length;tiles[idx].className="tile focus";}
  setFocus(0);
  function launch(app){try{var b=new PalmServiceBridge();b.onservicecallback=function(){};b.call("luna://com.webos.service.applicationmanager/launch",JSON.stringify({id:app}));}catch(e){}}
  document.addEventListener("keydown",function(e){
    var k=e.keyCode;
    if(k==39||k==40){setFocus(idx+1);}
    else if(k==37||k==38){setFocus(idx-1);}
    else if(k==13){launch(tiles[idx].getAttribute("data-app"));}
    else if(k==461||k==27||k==8){try{if(window.webOSSystem)webOSSystem.close();}catch(e){}}
  });
}catch(err){}
</script>
</body></html>
